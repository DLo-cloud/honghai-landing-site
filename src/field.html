<!doctype html>
<html lang="$lang"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f2eb"><meta name="description" content="$story">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>$product | $section · Cohesol</title>
<link rel="canonical" href="https://cohesol.com/$path/field/">
$alternates
<link rel="icon" href="/assets/cohesol-square.svg">
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/field.css">
</head><body class="field-page">
<a class="skip" href="#main">$skip</a>
<header class="header field-header">
<a class="brand" href="/$path/" aria-label="Cohesol"><span class="brand-lockup"><img class="brand-logo" src="/assets/cohesol-logo.svg" width="219" height="54" alt="Cohesol"></span></a>
<nav class="field-nav" aria-label="$language">$languages</nav>
</header>
<main id="main" class="section-wrap field-main">
<div class="field-kicker"><a href="/$path/">$home</a><span aria-hidden="true">/</span><span>$section</span></div>
<section aria-labelledby="field-title">
<h1 id="field-title">$product</h1>
<p class="field-story">$story</p>
<figure class="field-film">
<iframe src="https://www.youtube-nocookie.com/embed/3bXvBjuZZ00" title="$video_title" width="960" height="540" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
<figcaption><span>$caption</span><a class="text-link" href="https://youtu.be/3bXvBjuZZ00" target="_blank" rel="noopener">$watch</a></figcaption>
</figure>
</section>
<section class="field-service" aria-labelledby="service-title"><h2 id="service-title">$service</h2><p>$service_text</p><a class="button button-dark" href="/$path/contact/">$contact</a></section>
</main></body></html>
